<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Jardim Para Você 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #2b2b36;
            --shelf-color: #5c3a21;
            --shelf-top: #8b5a2b;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a24 0%, #2d2d3a 100%);
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            cursor: default;
        }

        /* Caixa de Mensagem */
        .dialog-box {
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid #ff99cc;
            border-radius: 12px;
            padding: 25px 30px;
            width: 85%;
            max-width: 800px;
            min-height: 140px;
            margin-top: 20px;
            margin-bottom: 50px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 15px rgba(255, 153, 204, 0.2);
            line-height: 1.8;
            font-size: 14px;
            z-index: 10;
            text-shadow: 2px 2px 0px #000;
        }

        .dialog-box::after {
            content: "♥";
            position: absolute;
            bottom: 15px;
            right: 20px;
            animation: blink 1.2s infinite;
            color: #ff3366;
            font-size: 18px;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; transform: scale(1); }
            50%, 100% { opacity: 0.3; transform: scale(0.9); }
        }

        /* Área do Jardim */
        .garden-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 30px;
            padding-bottom: 15px;
            z-index: 5;
            width: 100%;
            max-width: 1000px;
        }

        .shelf {
            position: absolute;
            bottom: 0;
            width: 100vw;
            height: 25px;
            background: var(--shelf-color);
            border-top: 6px solid var(--shelf-top);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            z-index: 1;
        }

        .plant-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        canvas {
            image-rendering: pixelated; /* Mantém o estilo retro/Lego nítido */
            display: block;
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.4));
            transition: all 0.3s ease;
        }

        .flower-head {
            transform-origin: bottom center;
            z-index: 3;
        }

        .pot {
            transform-origin: bottom center;
            margin-top: -5px; /* Junta a planta com o vaso */
            z-index: 2;
        }

        /* Interações */
        .plant-wrapper:hover {
            transform: translateY(-10px);
        }

        .plant-wrapper:hover .flower-head canvas {
            animation: sway 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
        }

        @keyframes sway {
            0% { transform: rotate(-4deg); }
            100% { transform: rotate(4deg); }
        }

        .jump {
            animation: jumpAnim 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
        }

        @keyframes jumpAnim {
            0% { transform: translateY(0) scale(1); }
            40% { transform: translateY(-40px) scale(1.05) rotate(3deg); }
            100% { transform: translateY(0) scale(1) rotate(0deg); }
        }

        /* Efeitos Mágicos */
        .sparkle {
            position: absolute;
            pointer-events: none;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            z-index: 100;
            animation: floatUp 1s ease-out forwards;
            box-shadow: 0 0 8px currentColor;
        }

        .heart-particle {
            position: absolute;
            pointer-events: none;
            font-size: 24px;
            z-index: 100;
            animation: burst 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            text-shadow: 0 0 5px rgba(255,0,0,0.5);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.5) rotate(45deg); opacity: 0; }
        }

        @keyframes burst {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(var(--rot)); opacity: 0; }
        }

        /* Responsividade para Celular */
        @media (max-width: 800px) {
            .garden-container {
                flex-wrap: wrap;
                gap: 15px;
            }
            .shelf { display: none; }
            .plant-wrapper {
                margin-bottom: 20px;
                border-bottom: 5px solid var(--shelf-top);
                padding-bottom: 5px;
            }
            .dialog-box { font-size: 11px; line-height: 1.6; padding: 15px; }
        }
    </style>
</head>

        // --- 4. MOTOR DE DESENHO (Canvas) ---
        // Aqui garantimos que 100% dos pixels vão aparecer sem bugs de CSS
        function createPixelCanvas(matrix, scale) {
            const canvas = document.createElement('canvas');
            const rows = matrix.length;
            const cols = matrix[0].length;
            
            // O tamanho real do canvas em pixels
            canvas.width = cols;
            canvas.height = rows;
            
            // O tamanho que ele vai ocupar na tela (ampliado e nítido)
            canvas.style.width = (cols * scale) + 'px';
            canvas.style.height = (rows * scale) + 'px';
            
            const ctx = canvas.getContext('2d');
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const char = matrix[y][x];
                    if (char !== '_' && C[char]) {
                        ctx.fillStyle = C[char];
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }
            return canvas;
        }

        const garden = document.getElementById('garden');
        
        // Define o tamanho do "bloco de lego" na tela

            const headDiv = document.createElement('div');

            wrapper.appendChild(headDiv);
            wrapper.appendChild(potDiv);
            
            // Eventos interativos
            addInteractions(wrapper);

            // Insere antes da prateleira (para ficar por cima dela)
            garden.insertBefore(wrapper, garden.lastElementChild);
        });

        // --- 5. INTERAÇÕES E MAGIAS ---
        function addInteractions(element) {
            // Efeito ao passar o mouse

                }
            });

                void element.offsetWidth; // Força atualização

                // Explosão de corações apaixonados

                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 3;

                for(let j = 0; j < 10; j++) {
                    createHeart(centerX, centerY);
                }
            });
        }

        function createSparkle(x, y, color) {
            const p = document.createElement('div');
            p.className = 'sparkle';
            p.style.left = (x - 10 + Math.random() * 20) + 'px';
            p.style.top = (y - 10 + Math.random() * 20) + 'px';
            p.style.backgroundColor = color;
            p.style.color = color; // Para o box-shadow
            document.body.appendChild(p);

            setTimeout(() => p.remove(), 1000);
        }

        function createHeart(x, y) {
            const h = document.createElement('div');
            h.className = 'heart-particle';
            // Corações variados

            h.innerHTML = coracoes[Math.floor(Math.random() * coracoes.length)];
            
            h.style.left = x + 'px';
            h.style.top = y + 'px';
            
            // Física da explosão

            const distance = 60 + Math.random() * 80;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance - 50; // Tende a subir
            const rot = (Math.random() - 0.5) * 180;

            h.style.setProperty('--tx', `${tx}px`);
            h.style.setProperty('--ty', `${ty}px`);
            h.style.setProperty('--rot', `${rot}deg`);

            document.body.appendChild(h);

            setTimeout(() => h.remove(), 1000);
        }
